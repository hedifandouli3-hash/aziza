<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background shadow -->
    <filter id="pkg-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>

    <!-- Metallic/plastic sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Bag gradient: Deep Warda Crimson Red -->
    <linearGradient id="wardaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91424" />
      <stop offset="40%" stop-color="#B70B19" />
      <stop offset="100%" stop-color="#86050F" />
    </linearGradient>

    <!-- Gold ribbon gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Spaghetti texture pattern -->
    <pattern id="spaghetti" width="6" height="20" patternUnits="userSpaceOnUse">
      <line x1="1" y1="0" x2="1" y2="20" stroke="#FDE68A" stroke-width="2" />
      <line x1="3.5" y1="0" x2="3.5" y2="20" stroke="#F59E0B" stroke-width="1.5" />
      <line x1="5.5" y1="0" x2="5.5" y2="20" stroke="#D97706" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Clean neutral canvas background -->
  <rect width="400" height="400" fill="#F8FAFC" rx="16" />

  <!-- Package Group with realistic shape -->
  <g transform="translate(130, 25)" filter="url(#pkg-shadow)">
    <!-- Main Pasta Pillow Bag (vertical 500g spaghetti format) -->
    <!-- Top & bottom heat seals -->
    <path d="M 5 0 L 135 0 L 140 12 L 0 12 Z" fill="#991B1B" />
    <line x1="0" y1="6" x2="140" y2="6" stroke="#FEF3C7" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.6" />
    
    <!-- Bag body -->
    <rect x="0" y="10" width="140" height="330" rx="6" fill="url(#wardaRed)" />

    <!-- Top golden header band -->
    <rect x="0" y="22" width="140" height="8" fill="url(#goldGradient)" />

    <!-- Warda Brand Oval Emblem -->
    <ellipse cx="70" cy="72" rx="54" ry="38" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" />
    
    <!-- Red Warda Rose Symbol -->
    <g transform="translate(70, 52) scale(0.9)">
      <!-- Stylized rose petals -->
      <path d="M 0 -10 C -8 -10, -12 -3, -8 4 C -4 10, 0 12, 0 12 C 0 12, 4 10, 8 4 C 12 -3, 8 -10, 0 -10 Z" fill="#DC2626" />
      <path d="M -2 -6 C -6 -6, -8 -1, -5 3 C -2 6, 0 8, 0 8 C 0 8, 2 6, 5 3 C 8 -1, 6 -6, -2 -6 Z" fill="#EF4444" />
      <circle cx="0" cy="-2" r="3.5" fill="#FEE2E2" />
      <!-- Leaves -->
      <path d="M -8 5 C -14 3, -16 8, -12 11 C -8 11, -7 8, -8 5 Z" fill="#15803D" />
      <path d="M 8 5 C 14 3, 16 8, 12 11 C 8 11, 7 8, 8 5 Z" fill="#15803D" />
    </g>

    <!-- WARDA text in bold brand font -->
    <text x="70" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#991B1B" text-anchor="middle" letter-spacing="1.5">WARDA</text>
    <text x="70" y="99" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="11" fill="#D97706" text-anchor="middle">وردة</text>

    <!-- Subtitle: Qualité Supérieure -->
    <rect x="15" y="116" width="110" height="18" rx="4" fill="#047857" />
    <text x="70" y="129" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">QUALITÉ SUPÉRIEURE</text>

    <!-- Transparent Window showing Spaghetti strands inside the bag -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="100" height="110" rx="8" fill="#1F2937" opacity="0.3" />
      <rect x="2" y="2" width="96" height="106" rx="6" fill="url(#spaghetti)" />
      <!-- Window border & highlights -->
      <rect x="0" y="0" width="100" height="110" rx="8" fill="none" stroke="#FCD34D" stroke-width="2" />
      <path d="M 10 10 L 90 100" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="10 20" />
    </g>

    <!-- Product Type banner: SPAGHETTI N°2 -->
    <rect x="10" y="260" width="120" height="24" rx="4" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
    <text x="70" y="276" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="11" fill="#78350F" text-anchor="middle" letter-spacing="0.8">SPAGHETTI N° 2</text>

    <!-- 100% Semoule de blé dur badge -->
    <text x="70" y="296" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="7.5" fill="#FEF3C7" text-anchor="middle">100% BLÉ DUR TUNISIEN</text>

    <!-- Weight Tag: 500g in bold circle -->
    <circle cx="108" cy="318" r="16" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="108" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="9" fill="#78350F" text-anchor="middle">500g</text>
    <text x="108" y="327" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="6" fill="#78350F" text-anchor="middle">غرام</text>

    <!-- Bottom heat seal -->
    <path d="M 0 338 L 140 338 L 135 350 L 5 350 Z" fill="#991B1B" />
    <line x1="0" y1="344" x2="140" y2="344" stroke="#FEF3C7" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.6" />

    <!-- Sheen overlay across package for 3D realism -->
    <rect x="0" y="10" width="140" height="330" rx="6" fill="url(#sheen)" pointer-events="none" />
  </g>
</svg>
